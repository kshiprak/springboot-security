server:
  port: 8081
spring:
  application:
    name: CRUD-operation


   

  datasource:
    url: jdbc:mysql://localhost:3306/mydb
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email 
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"